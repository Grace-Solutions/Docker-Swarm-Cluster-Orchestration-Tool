# NAME: EdgeLoadBalancer
# DESCRIPTION: Edge Load Balancer - Master (nginx-ui) manages configs, Slaves (nginx) serve traffic
# ENABLED: true
# NGINX_PROXY: false
# NOTE: Master (nginx-ui) writes configs/certs to shared storage (RW), Slaves read them (RO)
#       Proxy rules are auto-generated by dscotctl for services with NGINX_PROXY: true
#       nginx-ui provides a web UI for managing Nginx configuration and SSL certificates
# REQUIRES: docker node update --label-add EdgeLoadBalancerMaster=true <MASTER_NODE>
#           docker node update --label-add EdgeLoadBalancerSlave=true <SLAVE_NODE1> [<SLAVE_NODE2> ...]

services:
  # Master: nginx-ui - Manages Nginx configuration via web UI
  # Does NOT publish ports 80/443 to the host - UI is accessed through a Slave proxy rule
  # Writes to shared storage so Slaves can pick up config and certificate changes
  EdgeLoadBalancerMaster:
    image: uozi/nginx-ui:latest
    hostname: 'edgeloadbalancer-master-{{.Node.ID}}'
    volumes:
      # Shared storage for nginx config (read-write - managed by nginx-ui)
      # ${STORAGE_MOUNT_PATH} is replaced at deployment with the actual mount path from config
      # nginx-ui populates /etc/nginx with standard nginx layout on first start:
      #   nginx.conf, conf.d/, sites-available/, sites-enabled/, etc.
      - ${STORAGE_MOUNT_PATH}/data/EdgeLoadBalancer/nginx:/etc/nginx:rw
      # nginx-ui application data (settings, database, etc.)
      - ${STORAGE_MOUNT_PATH}/data/EdgeLoadBalancer/nginx-ui:/etc/nginx-ui:rw
      # Log directory for nginx-ui managed nginx
      - /var/log/nginx:/var/log/nginx:rw
    environment:
      TZ: UTC
    deploy:
      mode: replicated
      replicas: 1
      endpoint_mode: dnsrr
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.platform.os==linux
          - node.labels.EdgeLoadBalancerMaster==true
      resources:
        limits:
          cpus: '2'
          memory: 512M
        reservations:
          cpus: '0.1'
          memory: 128M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
    networks:
      - INTERNAL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30s

  # Slave: Nginx - Serves traffic using configs from shared storage
  # Publishes ports 80 and 443 in host mode for direct traffic handling
  # Reads /etc/nginx from shared storage (read-only) to get configs and certs from Master
  EdgeLoadBalancerSlave:
    image: nginx:stable-alpine
    hostname: 'edgeloadbalancer-slave-{{.Node.ID}}'
    command: ["nginx", "-g", "daemon off;", "-c", "/etc/nginx/nginx.conf"]
    ports:
      - target: 80
        published: 80
        protocol: tcp
        mode: host
      - target: 443
        published: 443
        protocol: tcp
        mode: host
    volumes:
      # Shared storage for nginx config (read-only - managed by nginx-ui Master)
      # Mounted at /etc/nginx so include paths from nginx-ui configs resolve correctly
      - ${STORAGE_MOUNT_PATH}/data/EdgeLoadBalancer/nginx:/etc/nginx:ro
      # Local bind mounts for ephemeral data (per-node, not shared)
      - /var/lib/nginx/cache:/var/cache/nginx:rw
      - /var/lib/nginx/tmp:/tmp/nginx:rw
      - /var/log/nginx:/var/log/nginx:rw
    environment:
      TZ: UTC
    deploy:
      mode: global
      endpoint_mode: dnsrr
      placement:
        max_replicas_per_node: 1
        constraints:
          - node.platform.os==linux
          - node.labels.EdgeLoadBalancerSlave==true
      resources:
        limits:
          cpus: '4'
          memory: 1G
        reservations:
          cpus: '0.25'
          memory: 256M
      restart_policy:
        condition: on-failure
        delay: 5s
        max_attempts: 3
        window: 120s
      update_config:
        parallelism: 1
        delay: 10s
        failure_action: rollback
        order: stop-first
      rollback_config:
        parallelism: 1
        delay: 10s
    networks:
      - INTERNAL
    healthcheck:
      test: ["CMD", "curl", "-sf", "http://localhost/health", "||", "exit", "1"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

networks:
  EXTERNAL:
    name: DOCKER-SWARM-SERVICES-EXTERNAL
    external: true
  INTERNAL:
    name: DOCKER-SWARM-SERVICES-INTERNAL
    external: true

